baseURL: https://miguelgondu.com/
title: miguelgondu's blog
theme: brutalist

disablePathToLower: true
enableGitInfo: true

# Needed for katex shortcodes
markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 1

params:
  description: "Miguel's blog"
  images:
    - static/blog_banner.jpg
  social:
    github: "miguelgondu"
    linkedin: "miguelgondu"
    twitter: "miguelgondu"

permalinks:
  page:
    posts: /blogposts/:year-:month-:day/:filename/
  section:
    posts: /blogposts/
