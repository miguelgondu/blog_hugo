{{ define "main" }}
<section>
  <h1>{{ .Title | upper }}</h1>

  {{ .Content }}

  {{- if .Pages }}
  <ul class="post-list">
    {{- range .Pages }}
    <li>
      <span class="post-date">{{ .Date.Format "2006-01-02" }}</span>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{- with .Params.summary }}
      <p class="post-excerpt">{{ . }}</p>
      {{- end }}
    </li>
    {{- end }}
  </ul>
  {{- end }}
</section>
{{ end }}
