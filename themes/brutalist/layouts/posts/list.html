{{ define "main" }}
<section>
  <h1>POSTS</h1>

  <ul class="post-list">
    {{- range .Site.RegularPages.ByDate.Reverse }}
    {{- if eq .Section "posts" }}
    <li>
      <span class="post-date">{{ .Date.Format "2006-01-02" }}</span>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{- with .Params.summary }}
      <p class="post-excerpt">{{ . }}</p>
      {{- end }}
    </li>
    {{- end }}
    {{- end }}
  </ul>
</section>
{{ end }}
