<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Summary }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}">

{{- with .Params.image }}
<meta property="og:image" content="{{ . | absURL }}">
{{- end }}

{{/* Fonts - using system fonts for speed, JetBrains Mono for code */}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

{{/* KaTeX for math rendering */}}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<script>
window.addEventListener("load", function() {
  console.log("KaTeX load event fired");
  console.log("renderMathInElement exists:", typeof renderMathInElement);
  var spans = document.querySelectorAll('span');
  console.log("Found spans:", spans.length);
  if (spans.length > 0) {
    console.log("First span content:", spans[0].textContent.substring(0, 50));
  }
  renderMathInElement(document.body, {
    delimiters: [
      {left: "\\[", right: "\\]", display: true},
      {left: "\\(", right: "\\)", display: false},
      {left: "$$", right: "$$", display: true},
      {left: "$", right: "$", display: false}
    ],
    throwOnError: false
  });
  console.log("renderMathInElement completed");
});
</script>

{{/* Main CSS */}}
{{- $css := resources.Get "css/main.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.Permalink }}">

{{/* Favicon */}}
<link rel="icon" href="{{ "favicon.png" | relURL }}" type="image/png">
